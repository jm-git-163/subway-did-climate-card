# 분석계획서 (사전 작성) - 데이터 값을 보기 전에 확정한다.
# 작성일: 2026-10-07
# 데이터 열람 상태: 부산교통공사 연도별 CSV 3개(2022~2024)를 내려받았으나 값은 열어보지 않았음.
#                  서울교통공사 파일은 아직 내려받지 않았음.
# 이후 이 파일을 바꾸면 git 기록에 그대로 남으며, 변경 사유를 README의 "계획 변경 기록"에 적는다.

question: >
  서울 기후동행카드 도입(2024-01-27)이 서울 지하철 이용량을 늘렸는가?
  카드가 없었던 부산 도시철도를 비교집단으로 둔 이중차분(DiD)으로 추정한다.

policy:
  name: 서울 기후동행카드 (정액권)
  start_date: 2024-01-27
  source_note: >
    도입일은 서울시 공개 정보 기준. 정확한 공식 출처 URL은 README 데이터 출처 절에 기록한다.

units:
  treated: 서울교통공사 1~8호선 역 (역-호선 단위)
  control: 부산교통공사 도시철도 1~4호선 역 (역-호선 단위)

data:
  seoul:
    name: 서울교통공사_1_8호선 역별 일별 시간대별 승객유형별 승하차인원
    portal: 공공데이터포털 (data.go.kr/data/15099330)
    license: 이용허락범위 제한 없음
    files: [20221231, 20230630, 20231231, 20240630, 20241231]   # 반기 파일
  busan:
    name: 부산교통공사_시간대별 승하차인원
    portal: 공공데이터포털 (data.go.kr/data/3057229)
    license: 이용허락범위 제한 없음
    files: [20221231, 20231231, 20241231]                        # 연도 파일

window:
  pre:  [2022-07-01, 2023-12-31]     # 18개월
  excluded_transition: [2024-01-01, 2024-01-31]   # 도입 달은 부분 처치이므로 제외
  post: [2024-02-01, 2024-12-31]     # 11개월

outcome:
  primary: log(월평균 평일 일 승차인원)      # 역-호선 단위, 월별
  definition_notes:
    - 승차(boarding) 인원만 사용한다. 승하차 합계는 환승/이중계수 해석이 어려워 사용하지 않는다.
    - 평일(월~금, 공휴일 제외 가능 시 제외)만 사용해 요일 구성 차이를 줄인다.
    - 환승역은 호선별로 게이트가 분리된 경우 호선별로 따로 있고 통합형은 합산되어 있다(부산 데이터 설명). 단위 불일치는 역-호선 고정효과로 흡수한다.

estimand: ATT (서울 역에 대한 평균 처치효과, 로그 차이 = 근사 % 변화)

model:
  primary: >
    역-호선 고정효과 + 월 고정효과를 넣은 이중차분.
    y_it = a_i + g_t + tau * (Seoul_i x Post_t) + e_it
  event_study: 도입 월을 기준(-1)으로 한 월별 상호작용 계수, 사전 추세 점검용
  inference:
    - 역-호선 군집 표준오차 (보조 지표이며, 처치 배정이 도시 단위이므로 과소추정 가능성을 명시)
    - 사전 기간 내 가짜 도입일(placebo-in-time) 반복으로 만든 분포와 실제 추정치 비교 (주 판단 근거)

assumptions:
  - 평행추세: 사전 기간에 서울과 부산의 로그 이용량 추세가 같다. 이벤트 스터디와 사전 추세 검정으로 확인한다.
  - 동시 사건 없음: 같은 시기 서울에만 또는 부산에만 영향을 준 다른 정책/요금 인상/사건이 없다. (확인 필요: 요금 인상 시점. 확인 후 README에 기록)
  - 파급 없음(SUTVA): 서울 정책이 부산 이용량에 영향을 주지 않는다.

robustness:
  - placebo_date: 2023-07-27 (사전 기간 내 가짜 도입일, 같은 길이의 전후 구간 사용)
  - 서울 호선별 추정 (1~8호선 각각)
  - 포함 기간 변경: 사전 12개월만 / 사후 6개월만
  - 이상치: 역 신설/폐쇄/공사 등으로 월 승차인원이 0 또는 급변한 역-호선 제외 후 재추정
  - 로그 변환 없이 수준(level)로 재추정

stop_rules:
  - 사전 추세가 명백히 다르면(이벤트 스터디 사전 계수가 일관되게 유의) 인과 해석을 하지 않고 "추세 차이로 효과 식별 불가"라고 보고한다.
  - 두 기관 자료가 같은 형식으로 이어지지 않는 구간이 있으면 해당 구간을 제외하고 그 사실을 보고한다.

reporting:
  - 결과가 0에 가까워도, 부호가 반대여도 그대로 보고한다.
  - 한계: 서울 1개 처치집단 vs 부산 1개 비교집단. 도시 단위 처치라 통계적 불확실성이 크다.

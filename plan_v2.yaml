# 분석계획서 2 (비교 도시 확장) - 대구·광주·대전 자료의 값을 보기 전에 확정한다.
# 작성일: 2026-10-15
# 데이터 열람 상태:
#   - 서울·부산: 계획 1(plan.yaml) 분석에서 2022-07~2024-12 값을 이미 봤다. 결과는 REPORT.md.
#   - 대구·광주·대전: 공공데이터포털의 과거 파일 목록(파일 이름, 등록일)만 확인했다. 값은 아직 열지 않았다.
# 계획 1과 다른 점과 이유는 README의 "계획 2" 절에 적는다.
# src/prepare_cities.py, src/estimate_cities.py 가 이 파일을 읽는다.
# 다른 정책을 보려면 policy, cities, window 만 바꿔서 쓸 수 있게 만든다.

question: >
  서울 기후동행카드 시범사업(2024-01-27) 전후로, 서울 지하철(서울교통공사 1~8호선)의 평일 승차 흐름은
  부산·대구·광주·대전 도시철도와 비교해 어떻게 달랐는가?
  그리고 공개 자료만으로 그 차이를 정책 효과로 판단할 수 있는가?

policy:
  name: 서울 기후동행카드 시범사업
  start_date: 2024-01-27        # 판매 2024-01-23, 본사업 2024-07-01
  source: https://news.seoul.go.kr/traffic/archives/513130
  treated_city: seoul

cities:
  seoul:   {name: 서울교통공사 1~8호선, portal: data.go.kr/data/15099330, files: semiannual}
  busan:   {name: 부산교통공사 1~4호선, portal: data.go.kr/data/3057229,  files: yearly}
  daegu:   {name: 대구교통공사 1~3호선, portal: data.go.kr/data/15002503, files: [20221231, 20231231, 20240430]}
  gwangju: {name: 광주교통공사 1호선,   portal: data.go.kr/data/15060048, files: [20221231, 20231231, 20240430]}
  daejeon: {name: 대전교통공사 1호선,   portal: data.go.kr/data/15060591, files: [20221231, 20231231, 20241231]}
  # 파일 하나가 한 달분인지 연초부터 누적인지는 열어서 날짜 범위만 보고 정한다(값은 보지 않음).
  # 필요한 달이 빠지면 같은 목록의 다른 파일로 채우고 README에 적는다.

window:
  pre:  [2022-07, 2023-12]      # 18개월
  excluded: [2024-01]           # 정책이 달 중간에 시작 → 모든 도시에서 제외
  post: [2024-02, 2024-04]      # 3개월. K-패스(2024-05-01 전국 시행), 본사업(2024-07-01) 이전에서 끊는다

# 같은 시기 요금 변화 (교란 요인 목록, 출처는 README)
fare_events:
  - {date: 2023-08-01, city: busan,   what: 동백패스(교통비 환급) 시작}
  - {date: 2023-10-06, city: busan,   what: 도시철도 기본요금 인상 1,300→1,450원}
  - {date: 2023-10-07, city: seoul,   what: 지하철 기본요금 인상 1,250→1,400원}
  - {date: 2024-01-01, city: daejeon, what: 도시철도 기본요금 인상 1,250→1,550원}
  - {date: 2024-01-13, city: daegu,   what: 도시철도 기본요금 인상(카드) 1,250→1,500원}
  - {date: 2024-05-01, city: all,     what: K-패스 시행 (분석 기간 밖)}

panel:
  unit: 도시 x 월
  stations: 기간 22개월(2024-01 제외 21개월) 모두 자료가 있고 승차가 0보다 큰 역만 더한다(도시별 균형 표본)
  outcome: log(해당 월 평일(월~금) 하루 평균 승차 인원의 도시 합계)
  outcome_secondary: log(주말(토·일) 하루 평균 승차 인원의 도시 합계)

model:
  main: >
    y_ct = 도시 고정효과 + 월 고정효과 + tau * (서울 x 사후). 대조 도시 4곳 모두 사용.
    tau 는 로그 차이라 대략 % 변화로 읽는다.
  inference: >
    처치 도시가 1곳이라 일반적인 표준오차는 쓰지 않는다.
    가짜 처치 도시 비교(placebo-in-space): 대조 도시 4곳을 차례로 '처치'로 두고 같은 모형을 돌려,
    서울의 값이 5개 중 몇 번째로 큰지 본다. 기준은 두 가지:
      (1) |tau| 순위
      (2) 사후 격차 크기 / 사전 격차 크기 (사전·사후 RMSPE 비율) 순위
    5곳뿐이라 서울이 1위여도 순위 p값은 1/5 = 0.2 이다.

checks:
  pre_trend: >
    사전 18개월 동안 '서울 - 대조 평균' 격차에 직선 추세를 맞춰 기울기와 95% 구간을 본다.
    월별 격차 그림(event study 형태, 기준월 2023-12)도 함께 그린다.
  placebo_time: 사전 구간만으로 가짜 시작월 2023-08 을 두고 같은 모형 추정
  sensitivity:
    - 대조를 부산·광주만 (2024-01 요금 인상이 있었던 대구·대전 제외)
    - 사전 기준을 2023-10~2023-12 로 (서울·부산 요금 인상 뒤 기간만)
    - 주말 승차(보조 지표)
    - 역 단위 패널(계획 1 방식)에 대조 도시 4곳을 넣은 재추정 (참고용, 표준오차는 과소추정 가능)

verdict:  # 세 단계 중 하나로 쓴다
  effect_evidence: >
    '효과 근거 있음'은 다음을 모두 만족할 때만: 사전 격차 추세 기울기 구간이 0을 포함,
    가짜 시작월 추정치가 실제 추정치 절댓값의 절반 미만, 서울이 두 순위 기준에서 모두 1위,
    부산·광주만 대조로 써도 부호가 같음.
    단, 도시 5곳이라 순위 p값이 0.2보다 작아질 수 없으므로 이 설계로는 '효과 근거 있음'이 나오기 어렵다는 점을 미리 적어 둔다.
  conditional: 위 조건 중 일부만 만족
  not_identified: 사전 격차 추세가 뚜렷하거나(기울기 구간이 0을 포함하지 않음), 가짜 시작월 추정치가 실제 추정치만큼 크면

wording:
  - 판정이 '효과 근거 있음'이 아니면 "입증", "때문에", "덕분에", "확실히", "명백히" 같은 표현을 쓰지 않는다.
  - 구간이 0을 포함하면 "효과 없음"이 아니라 "판별할 수 없음"으로 쓴다.
  - 결과가 0에 가깝거나 부호가 반대여도 그대로 적는다.
